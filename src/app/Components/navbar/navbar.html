<!-- Center: search -->
<div class="navbar__center">
  <div class="navbar__search-container">
    <form class="navbar__search" (ngSubmit)="onSearchSubmit()">
      <p-autocomplete
        [(ngModel)]="searchTerm"
        name="search"
        [suggestions]="suggestions"
        (completeMethod)="search($event)"
        (onSelect)="onSuggestionSelect($event.value)"
        field="name"
        [delay]="300"
        [minLength]="1"
        placeholder="Search products, brands and categories"
        aria-label="Search products"
        styleClass="navbar__search-field"
      >
        <ng-template let-item pTemplate="item">
          <div class="suggestion-info">
            <span class="suggestion-name">{{ item.name }}</span>
            <span class="suggestion-description">{{ item.description }}</span>
          </div>
          <span class="suggestion-price">
            Rs. {{ item.price | number }}
          </span>
        </ng-template>
      </p-autocomplete>

      <p-button type="submit" label="Search" size="small" styleClass="navbar__search-btn" />

    </form>

  </div>
</div>
    <!-- Right: cart + profile -->
        <p-toast position="top-left" key="tl" [style]="{ width: 'clamp(280px, 90vw, 400px)' }"/>
    <div class="navbar__right">
      <button type="button" class="navbar__icon-btn" (click)="onCartClick()" aria-label="Cart">
        <p-overlaybadge [value]="cartCount > 0 ? (cartCount > 99 ? '99+' : cartCount) : undefined" severity="danger">
          <i class="pi pi-shopping-cart navbar__cart-icon"></i>
        </p-overlaybadge>
      </button>

  <p-button icon="pi pi-user" label="Login" [routerLink]="'signin'"></p-button>
      <button type="button" class="navbar__profile" (click)="profileMenu.toggle($event)" aria-haspopup="true"
        [attr.aria-label]="'Account for ' + userName">
        @if (userAvatarUrl) {
        <p-avatar [image]="userAvatarUrl" shape="circle" size="normal" />
        } @else {
        <p-avatar [label]="initials" shape="circle" size="normal" styleClass="navbar__avatar-fallback" />
        }
        <i class="pi pi-angle-down navbar__caret"></i>
      </button>
      <p-menu #profileMenu [model]="profileItems" [popup]="true" appendTo="body" />
    </div>

  </div>
</header>
