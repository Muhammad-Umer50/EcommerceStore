@if(loading()){
<div class="card flex justify-center">
  <p-progress-spinner strokeWidth="8" fill="transparent" animationDuration=".5s"
    [style]="{ width: '50px', height: '50px' }" />
</div>
}
@else {
<div class="card" >
  <p-dataview #dv [value]="products()" [layout]="layout">
    <ng-template #header>
      <div class="flex justify-end">
        <p-selectbutton [(ngModel)]="layout" [options]="options" [allowEmpty]="false">
          <ng-template #item let-item>
            <i class="pi " [ngClass]="{ 'pi-bars': item === 'list', 'pi-table': item === 'grid' }"></i>
          </ng-template>
        </p-selectbutton>
      </div>
    </ng-template>
    <ng-template #list let-items>
      <div *ngFor="let item of items; let first = first" >
        <div class="flex flex-col sm:flex-row sm:items-center p-6 gap-4"
          [ngClass]="{ 'border-t border-surface-200 dark:border-surface-700': !first }" (click)="GotoDetails(item.id)">
          <div class="md:w-40 relative" >
            <img class="block xl:block mx-auto rounded w-full" [src]="getMainImage(item)" [alt]="item.name"   />
            <p-tag [value]="item.stockQuantity > 0 ? 'In Stock' : 'Out of Stock'"
              [severity]="getSeverity(item.stockQuantity)" class="absolute dark:bg-surface-900!" [style.left.px]="4"
              [style.top.px]="4" />
          </div>
          <div class="flex flex-col md:flex-row justify-between md:items-center flex-1 gap-6">
            <div class="flex flex-row md:flex-col justify-between items-start gap-2" >
              <div>
                <span class="font-medium text-surface-500 dark:text-surface-400 text-sm"></span>
                <div class="text-lg font-medium mt-2">{{ item.name }}</div>
              </div>
              <div class="bg-surface-100 p-1" style="border-radius: 30px" >
                <div class="bg-surface-0 flex items-center gap-2 justify-center py-1 px-2"
                  style="border-radius: 30px; box-shadow: 0px 1px 2px 0px rgba(0, 0, 0, 0.04), 0px 1px 2px 0px rgba(0, 0, 0, 0.06)">
                  <span class="text-surface-900 font-medium text-sm">{{ item.rating }}</span>
                  <i class="pi pi-star-fill text-yellow-500"></i>
                </div>
              </div>
            </div>
            <div class="flex flex-col md:items-end gap-8">
              <span class="text-xl font-semibold">{{ item.price | currency: 'USD' }}</span>
              <div class="flex flex-row-reverse md:flex-row gap-2">
                <button pButton icon="pi pi-heart" [outlined]="true"></button>
                <button pButton icon="pi pi-shopping-cart" label="Buy Now"
                  [disabled]="item.inventoryStatus === 'OUTOFSTOCK'"
                  class="flex-auto md:flex-initial whitespace-nowrap" (click)="GotoDetails(item.id)"></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
    <ng-template #grid let-items>
      <div class="grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));">
        <div *ngFor="let product of items" class="p-2">
          <div
            class="min-h-55 p-6 border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900 rounded flex flex-col">
            <div class="bg-surface-50 flex justify-center rounded p-4" (click)="GotoDetails(product.id)">
              <div class="relative mx-auto">
                <img class="rounded w-full" [src]="getMainImage(product)" [alt]="product.name"
                  style="max-width: 200px ;max-height : 200px" />
                <p-tag
                  [value]="product.stockQuantity > 10 ? 'In Stock' : product.stockQuantity > 0 ? 'low stock' : 'Out of Stock'"
                  [severity]="getSeverity(product.stockQuantity)" class="absolute dark:bg-surface-900!"
                  [style.left.px]="-25" [style.top.px]="-12" />
              </div>
            </div>
            <div class="pt-6">
              <div class="flex flex-row justify-between products-start gap-2">
                <div>
                  <span class="font-medium text-surface-500 dark:text-surface-400 text-sm"></span>
                  <div class="text-lg font-medium mt-1">{{ product.name }}</div>
                </div>
                <div class="bg-surface-100 p-1" style="border-radius: 30px; height:100%">
                  <div class="bg-surface-0 flex products-center gap-2 justify-center py-1 px-2"
                    style="border-radius: 30px; box-shadow: 0px 1px 2px 0px rgba(0, 0, 0, 0.04), 0px 1px 2px 0px rgba(0, 0, 0, 0.06)">
                    <span class="text-surface-900 font-medium text-sm">{{ product.rating }}</span>
                    <i class="pi pi-star-fill text-yellow-500"></i>
                  </div>
                </div>
              </div>
              <div class="flex flex-col gap-6 mt-6">
                <span class="text-2xl font-semibold">{{ product.price | currency: 'USD' }}</span>
                <div class="flex gap-2">
                  <button pButton icon="pi pi-shopping-cart" label="Buy Now" [disabled]="product.isAvailable === false"
                    class="flex-auto whitespace-nowrap"></button>
                  <button pButton icon="pi pi-heart" outlined></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </p-dataview>
  <div class="card flex justify-center">
    <p-paginator (onPageChange)="onPageChange($event)" [first]="first" [rows]="rows" [totalRecords]="120"
      [rowsPerPageOptions]="[10, 20, 30]" />
  </div>
</div>
}
